services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axiom_app
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      - PORT=3001
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - FRONTEND_DIST=/app/frontend/dist
    depends_on:
      - redis
      - qdrant
    volumes:
      - app_data:/app/backend/prisma
      - app_uploads:/app/backend/uploads
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: axiom_qdrant
    ports:
      - "6333:6333" # HTTP REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334" # gRPC interface
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: axiom_redis
    ports:
      - "6379:6379" # Redis port for BullMQ background ingestion queue
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  qdrant_storage:
  redis_data:
  app_data:
  app_uploads:
